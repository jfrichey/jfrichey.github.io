<circle cx="234" cy="139" r="8" fill="var(--figure-muted, #476452)" stroke="var(--figure-bg, #e8f1e5)" stroke-width="2"/>
<text x="234" y="180" fill="var(--figure-ink, #244333)" font-size="25" font-family="DejaVu Sans,Arial,sans-serif" font-weight="400" text-anchor="middle">C</text>
<line x1="344" y1="139" x2="388" y2="139" stroke="var(--figure-muted, #476452)" stroke-width="8" />
<line x1="344" y1="127" x2="344" y2="151" stroke="var(--figure-muted, #476452)" stroke-width="3" />
<line x1="388" y1="127" x2="388" y2="151" stroke="var(--figure-muted, #476452)" stroke-width="3" />
<circle cx="366" cy="139" r="8" fill="var(--figure-muted, #476452)" stroke="var(--figure-bg, #e8f1e5)" stroke-width="2"/>
