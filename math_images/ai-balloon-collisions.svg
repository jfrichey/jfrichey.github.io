<line x1="432" y1="279" x2="432" y2="303" stroke="var(--figure-accent, #16763a)" stroke-width="3" />
<circle cx="366" cy="291" r="8" fill="var(--figure-accent, #16763a)" stroke="var(--figure-bg, #e8f1e5)" stroke-width="2"/>
<text x="366" y="332" fill="var(--figure-ink, #244333)" font-size="25" font-family="DejaVu Sans,Arial,sans-serif" font-weight="400" text-anchor="middle">D</text>
<line x1="476" y1="291" x2="608" y2="291" stroke="var(--figure-muted, #476452)" stroke-width="8" />
<line x1="476" y1="279" x2="476" y2="303" stroke="var(--figure-muted, #476452)" stroke-width="3" />
<line x1="608" y1="279" x2="608" y2="303" stroke="var(--figure-muted, #476452)" stroke-width="3" />
<circle cx="542" cy="291" r="8" fill="var(--figure-muted, #476452)" stroke="var(--figure-bg, #e8f1e5)" stroke-width="2"/>
<text x="542" y="332" fill="var(--figure-ink, #244333)" font-size="25" font-family="DejaVu Sans,Arial,sans-serif" font-weight="400" text-anchor="middle">E</text>
