<text x="234" y="332" fill="var(--figure-ink, #244333)" font-size="25" font-family="DejaVu Sans,Arial,sans-serif" font-weight="400" text-anchor="middle">C</text>
<line x1="300" y1="291" x2="432" y2="291" stroke="var(--figure-accent, #16763a)" stroke-width="8" />
