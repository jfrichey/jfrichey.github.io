<text x="36" y="429" fill="var(--figure-ink, #244333)" font-size="29" font-family="DejaVu Sans,Arial,sans-serif" font-weight="400" text-anchor="start">E survives</text>
<circle cx="542" cy="419" r="18" fill="var(--figure-accent, #16763a)" stroke="var(--figure-bg, #e8f1e5)" stroke-width="3"/>
</svg>
