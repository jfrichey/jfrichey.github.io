<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" role="img" aria-labelledby="ai-balloon-collisions-title ai-balloon-collisions-desc">
<title id="ai-balloon-collisions-title">Two collisions leave one balloon</title>
<desc id="ai-balloon-collisions-desc">Five unit-speed growing intervals start at positions 0, 2, 7, 13 and 21 on a line, labelled A through E. A and B meet and disappear at time 1; C and D at time 3; E survives. Each row shows the remaining intervals just before its collision. This is a finite deterministic example.</desc>
<rect width="640" height="480" fill="var(--figure-bg, #e8f1e5)"/>
<text x="36" y="46" fill="var(--figure-ink, #244333)" font-size="25" font-family="DejaVu Sans,Arial,sans-serif" font-weight="400" text-anchor="start">COLLISIONS ON A LINE</text>
<text x="36" y="101" fill="var(--figure-ink, #244333)" font-size="25" font-family="DejaVu Sans,Arial,sans-serif" font-weight="400" text-anchor="start">t = 1</text>
<line x1="58" y1="139" x2="102" y2="139" stroke="var(--figure-accent, #16763a)" stroke-width="8" />
<line x1="58" y1="127" x2="58" y2="151" stroke="var(--figure-accent, #16763a)" stroke-width="3" />
<line x1="102" y1="127" x2="102" y2="151" stroke="var(--figure-accent, #16763a)" stroke-width="3" />
<circle cx="80" cy="139" r="8" fill="var(--figure-accent, #16763a)" stroke="var(--figure-bg, #e8f1e5)" stroke-width="2"/>
<text x="80" y="180" fill="var(--figure-ink, #244333)" font-size="25" font-family="DejaVu Sans,Arial,sans-serif" font-weight="400" text-anchor="middle">A</text>
<line x1="102" y1="139" x2="146" y2="139" stroke="var(--figure-accent, #16763a)" stroke-width="8" />
<line x1="102" y1="127" x2="102" y2="151" stroke="var(--figure-accent, #16763a)" stroke-width="3" />
<line x1="146" y1="127" x2="146" y2="151" stroke="var(--figure-accent, #16763a)" stroke-width="3" />
<circle cx="124" cy="139" r="8" fill="var(--figure-accent, #16763a)" stroke="var(--figure-bg, #e8f1e5)" stroke-width="2"/>
<text x="124" y="180" fill="var(--figure-ink, #244333)" font-size="25" font-family="DejaVu Sans,Arial,sans-serif" font-weight="400" text-anchor="middle">B</text>
<line x1="212" y1="139" x2="256" y2="139" stroke="var(--figure-muted, #476452)" stroke-width="8" />
<line x1="212" y1="127" x2="212" y2="151" stroke="var(--figure-muted, #476452)" stroke-width="3" />
