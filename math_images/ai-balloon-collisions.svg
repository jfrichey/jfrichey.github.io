<circle cx="542" cy="139" r="8" fill="var(--figure-muted, #476452)" stroke="var(--figure-bg, #e8f1e5)" stroke-width="2"/>
<text x="542" y="180" fill="var(--figure-ink, #244333)" font-size="25" font-family="DejaVu Sans,Arial,sans-serif" font-weight="400" text-anchor="middle">E</text>
