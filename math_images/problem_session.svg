<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">A collaborative mathematics problem session</title>
  <desc id="desc">A top-down table with six students sharing notes around a central graph problem.</desc>
  <defs>
    <style>.page{fill:#fffdf8;stroke:#d3ccbf;stroke-width:4}.pencil{stroke:#d49a33;stroke-width:13;stroke-linecap:round}.ink{fill:none;stroke:#39465c;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}.edge{fill:none;stroke-width:10;stroke-linecap:round}.node{fill:#252b2a}</style>
  </defs>
  <rect width="1200" height="900" fill="#25324d"/>
  <ellipse cx="600" cy="450" rx="466" ry="337" fill="#e9dfcf" stroke="#d1c2ac" stroke-width="8"/>

  <!-- six people, drawn as quiet color and shape rather than stock faces -->
  <g stroke="#f4f0e8" stroke-width="8">
    <circle cx="310" cy="110" r="66" fill="#315fa3"/><circle cx="600" cy="78" r="66" fill="#c45443"/><circle cx="890" cy="110" r="66" fill="#56866e"/>
    <circle cx="310" cy="790" r="66" fill="#d49a33"/><circle cx="600" cy="822" r="66" fill="#6d4a78"/><circle cx="890" cy="790" r="66" fill="#3d7897"/>
  </g>

  <!-- notebooks around the table -->
  <rect class="page" x="224" y="226" width="238" height="142" rx="9"/>
  <path class="ink" d="M255 262h112m-112 28h163m-163 28h128" opacity=".55"/>
  <path class="pencil" d="M433 207l-74 47"/>

  <rect class="page" x="738" y="226" width="238" height="142" rx="9"/>
  <path class="ink" d="M769 262h155m-155 28h112m-112 28h158" opacity=".55"/>
  <path class="pencil" d="M766 207l75 47"/>

  <rect class="page" x="224" y="532" width="238" height="142" rx="9"/>
  <path class="ink" d="M255 568h142m-142 28h166m-166 28h108" opacity=".55"/>
  <path class="pencil" d="M435 695l-74-48"/>

  <rect class="page" x="738" y="532" width="238" height="142" rx="9"/>
  <path class="ink" d="M769 568h119m-119 28h161m-161 28h138" opacity=".55"/>
  <path class="pencil" d="M765 695l77-48"/>

  <!-- the shared problem in the middle -->
  <rect x="444" y="294" width="312" height="312" rx="16" fill="#fffdf8" stroke="#bfb6a8" stroke-width="6"/>
  <path d="M483 565h234" fill="none" stroke="#343a38" stroke-width="7" stroke-linecap="round"/>
  <path class="edge" d="M521 565l41-79-29-76 58-68" stroke="#56866e"/>
  <path class="edge" d="M562 486l73-45 38-70" stroke="#315fa3"/>
  <path class="edge" d="M635 441l-17-76 36-45" stroke="#c45443"/>
  <path class="edge" d="M635 441l63 49 27-59" stroke="#c45443"/>
  <g class="node"><circle cx="521" cy="565" r="8"/><circle cx="562" cy="486" r="8"/><circle cx="533" cy="410" r="8"/><circle cx="591" cy="342" r="8"/><circle cx="635" cy="441" r="8"/><circle cx="673" cy="371" r="8"/><circle cx="618" cy="365" r="8"/><circle cx="654" cy="320" r="8"/><circle cx="698" cy="490" r="8"/><circle cx="725" cy="431" r="8"/></g>
  <path d="M489 629c73 34 149 34 222 0" fill="none" stroke="#6d4a78" stroke-width="6" stroke-linecap="round" stroke-dasharray="2 18"/>
</svg>
