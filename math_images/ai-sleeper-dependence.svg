<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" role="img" aria-labelledby="ai-sleeper-dependence-title ai-sleeper-dependence-desc">
<title id="ai-sleeper-dependence-title">Dependence between disjoint groups of sites</title>
<desc id="ai-sleeper-dependence-desc">Two disjoint groups A and B of possible sleeping sites are marked with solid and dashed boundaries. A question mark asks about their dependence. The pictured occupancy choices are illustrative, not a sample from a stationary law and not a negative-correlation claim.</desc>
<rect width="640" height="480" fill="var(--figure-bg, #e8f1e5)"/>
<text x="36" y="52" fill="var(--figure-ink, #244333)" font-size="25" font-family="DejaVu Sans,Arial,sans-serif" font-weight="400" text-anchor="start">TWO DISJOINT GROUPS</text>
<rect x="64" y="107" width="216" height="232" rx="16" fill="var(--figure-soft, #cee8d1)" fill-opacity="0.65" stroke="var(--figure-ink, #244333)" stroke-width="3"/>
<text x="172" y="91" fill="var(--figure-ink, #244333)" font-size="31" font-family="DejaVu Sans,Arial,sans-serif" font-weight="400" text-anchor="middle">A</text>
<circle cx="104" cy="151" r="15" fill="var(--figure-bg, #e8f1e5)" stroke="var(--figure-ink, #244333)" stroke-width="3"/>
<circle cx="172" cy="151" r="15" fill="var(--figure-ink, #244333)" stroke="var(--figure-ink, #244333)" stroke-width="3"/>
<circle cx="240" cy="151" r="15" fill="var(--figure-ink, #244333)" stroke="var(--figure-ink, #244333)" stroke-width="3"/>
<circle cx="104" cy="219" r="15" fill="var(--figure-ink, #244333)" stroke="var(--figure-ink, #244333)" stroke-width="3"/>
<circle cx="172" cy="219" r="15" fill="var(--figure-bg, #e8f1e5)" stroke="var(--figure-ink, #244333)" stroke-width="3"/>
<circle cx="240" cy="219" r="15" fill="var(--figure-ink, #244333)" stroke="var(--figure-ink, #244333)" stroke-width="3"/>
<circle cx="104" cy="287" r="15" fill="var(--figure-ink, #244333)" stroke="var(--figure-ink, #244333)" stroke-width="3"/>
<circle cx="172" cy="287" r="15" fill="var(--figure-ink, #244333)" stroke="var(--figure-ink, #244333)" stroke-width="3"/>
<circle cx="240" cy="287" r="15" fill="var(--figure-bg, #e8f1e5)" stroke="var(--figure-ink, #244333)" stroke-width="3"/>
<rect x="360" y="107" width="216" height="232" rx="16" fill="var(--figure-soft, #cee8d1)" fill-opacity="0.65" stroke="var(--figure-accent, #16763a)" stroke-width="3" stroke-dasharray="11 7"/>
<text x="468" y="91" fill="var(--figure-accent, #16763a)" font-size="31" font-family="DejaVu Sans,Arial,sans-serif" font-weight="400" text-anchor="middle">B</text>
<circle cx="400" cy="151" r="15" fill="var(--figure-ink, #244333)" stroke="var(--figure-ink, #244333)" stroke-width="3"/>
<circle cx="468" cy="151" r="15" fill="var(--figure-bg, #e8f1e5)" stroke="var(--figure-ink, #244333)" stroke-width="3"/>
<circle cx="536" cy="151" r="15" fill="var(--figure-ink, #244333)" stroke="var(--figure-ink, #244333)" stroke-width="3"/>
<circle cx="400" cy="219" r="15" fill="var(--figure-ink, #244333)" stroke="var(--figure-ink, #244333)" stroke-width="3"/>
<circle cx="468" cy="219" r="15" fill="var(--figure-ink, #244333)" stroke="var(--figure-ink, #244333)" stroke-width="3"/>
<circle cx="536" cy="219" r="15" fill="var(--figure-bg, #e8f1e5)" stroke="var(--figure-ink, #244333)" stroke-width="3"/>
<circle cx="400" cy="287" r="15" fill="var(--figure-bg, #e8f1e5)" stroke="var(--figure-ink, #244333)" stroke-width="3"/>
<circle cx="468" cy="287" r="15" fill="var(--figure-ink, #244333)" stroke="var(--figure-ink, #244333)" stroke-width="3"/>
<circle cx="536" cy="287" r="15" fill="var(--figure-ink, #244333)" stroke="var(--figure-ink, #244333)" stroke-width="3"/>
<text x="320" y="244" fill="var(--figure-accent, #16763a)" font-size="50" font-family="DejaVu Sans,Arial,sans-serif" font-weight="400" text-anchor="middle">?</text>
<text x="320" y="420" fill="var(--figure-ink, #244333)" font-size="26" font-family="DejaVu Sans,Arial,sans-serif" font-weight="400" text-anchor="middle">How are A and B related?</text>
</svg>
