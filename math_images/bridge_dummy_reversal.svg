<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">A dummy reversal bridge problem</title>
  <desc id="desc">Two bridge hands from Jacob Richey's dummy reversal essay, with a six hearts contract and a diamond king lead.</desc>
  <defs>
    <style>
      .sans{font-family:Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',Arial,sans-serif}.serif{font-family:Georgia,'Times New Roman',serif}.caps{font-family:Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',Arial,sans-serif;font-weight:700;letter-spacing:4px}.hand{fill:#f9fcff;stroke:#9fb8c9;stroke-width:2}.suit{font-family:Georgia,'Times New Roman',serif;font-size:48px}.holding{font-family:Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',Arial,sans-serif;font-size:45px;font-weight:500;letter-spacing:.5px;fill:#15242e}.minor{font-family:Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',Arial,sans-serif;font-size:20px;font-weight:750;letter-spacing:3px;fill:#688397}.rule{stroke:#9fb8c9;stroke-width:2}
    </style>
  </defs>

  <rect width="1200" height="900" fill="#dcebf5"/>
  <rect x="52" y="48" width="1096" height="804" rx="18" fill="#17364b"/>

  <text class="caps" x="98" y="104" font-size="18" fill="#9fc7df">CARD-PLAY PROBLEM</text>
  <text class="serif" x="98" y="159" font-size="59" fill="#f8fbfd">Can you make 6<tspan fill="#e76d68">♥</tspan>?</text>
  <text class="sans" x="98" y="205" font-size="24" font-weight="500" fill="#b9d1df">North leads the king of diamonds.</text>

  <rect class="hand" x="84" y="248" width="462" height="420" rx="12"/>
  <rect class="hand" x="654" y="248" width="462" height="420" rx="12"/>

  <text class="minor" x="122" y="298">WEST</text>
  <line class="rule" x1="122" y1="320" x2="508" y2="320"/>
  <text class="suit" x="124" y="389" fill="#17232b">♠</text><text class="holding" x="195" y="389">A 7 5</text>
  <text class="suit" x="124" y="461" fill="#c8534f">♥</text><text class="holding" x="195" y="461">A K Q 10 3</text>
  <text class="suit" x="124" y="533" fill="#c8534f">♦</text><text class="holding" x="195" y="533">2</text>
  <text class="suit" x="124" y="605" fill="#17232b">♣</text><text class="holding" x="195" y="605">A K Q 3</text>

  <text class="minor" x="692" y="298">EAST</text>
  <line class="rule" x1="692" y1="320" x2="1078" y2="320"/>
  <text class="suit" x="694" y="389" fill="#17232b">♠</text><text class="holding" x="765" y="389">J 8 2</text>
  <text class="suit" x="694" y="461" fill="#c8534f">♥</text><text class="holding" x="765" y="461">J 9 8 7</text>
  <text class="suit" x="694" y="533" fill="#c8534f">♦</text><text class="holding" x="765" y="533">A 7 4 3</text>
  <text class="suit" x="694" y="605" fill="#17232b">♣</text><text class="holding" x="765" y="605">9 2</text>

  <g aria-hidden="true">
    <path d="M544 420h112" stroke="#7fa2b7" stroke-width="2"/>
    <circle cx="600" cy="420" r="44" fill="#f8fbfd" stroke="#9fb8c9" stroke-width="2"/>
    <text class="serif" x="600" y="432" text-anchor="middle" font-size="34" fill="#17364b">6<tspan fill="#c8534f">♥</tspan></text>
  </g>

  <line x1="98" y1="724" x2="1102" y2="724" stroke="#55768b" stroke-width="1"/>
  <text class="sans" x="98" y="769" font-size="20" font-weight="700" letter-spacing="2" fill="#d7e7f0">THE DUMMY REVERSAL</text>
</svg>
