<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" role="img" aria-labelledby="ai-particle-wakeup-title ai-particle-wakeup-desc">
<title id="ai-particle-wakeup-title">One arrival wakes a sleeper</title>
<desc id="ai-particle-wakeup-desc">Before a jump there is one active particle at a site, a sleeping particle at its right neighbor, and another unchanged sleeper farther right. After the jump the arrival site has two active particles. This is one legal ARW event, not a simulation.</desc>
<rect width="640" height="480" fill="var(--figure-bg, #e8f1e5)"/>
<text x="36" y="69" fill="var(--figure-ink, #244333)" font-size="25" font-family="DejaVu Sans,Arial,sans-serif" font-weight="400" text-anchor="start">BEFORE</text>
<line x1="64" y1="132" x2="576" y2="132" stroke="var(--figure-line, #92b89d)" stroke-width="3" />
<circle cx="88" cy="132" r="4" fill="var(--figure-line, #92b89d)" stroke="var(--figure-line, #92b89d)" stroke-width="2"/>
<circle cx="180" cy="132" r="4" fill="var(--figure-line, #92b89d)" stroke="var(--figure-line, #92b89d)" stroke-width="2"/>
<circle cx="272" cy="132" r="4" fill="var(--figure-line, #92b89d)" stroke="var(--figure-line, #92b89d)" stroke-width="2"/>
<circle cx="364" cy="132" r="4" fill="var(--figure-line, #92b89d)" stroke="var(--figure-line, #92b89d)" stroke-width="2"/>
<circle cx="456" cy="132" r="4" fill="var(--figure-line, #92b89d)" stroke="var(--figure-line, #92b89d)" stroke-width="2"/>
<circle cx="548" cy="132" r="4" fill="var(--figure-line, #92b89d)" stroke="var(--figure-line, #92b89d)" stroke-width="2"/>
<text x="36" y="241" fill="var(--figure-ink, #244333)" font-size="25" font-family="DejaVu Sans,Arial,sans-serif" font-weight="400" text-anchor="start">AFTER</text>
<line x1="64" y1="304" x2="576" y2="304" stroke="var(--figure-line, #92b89d)" stroke-width="3" />
<circle cx="88" cy="304" r="4" fill="var(--figure-line, #92b89d)" stroke="var(--figure-line, #92b89d)" stroke-width="2"/>
<circle cx="180" cy="304" r="4" fill="var(--figure-line, #92b89d)" stroke="var(--figure-line, #92b89d)" stroke-width="2"/>
<circle cx="272" cy="304" r="4" fill="var(--figure-line, #92b89d)" stroke="var(--figure-line, #92b89d)" stroke-width="2"/>
<circle cx="364" cy="304" r="4" fill="var(--figure-line, #92b89d)" stroke="var(--figure-line, #92b89d)" stroke-width="2"/>
<circle cx="456" cy="304" r="4" fill="var(--figure-line, #92b89d)" stroke="var(--figure-line, #92b89d)" stroke-width="2"/>
<circle cx="548" cy="304" r="4" fill="var(--figure-line, #92b89d)" stroke="var(--figure-line, #92b89d)" stroke-width="2"/>
<circle cx="272" cy="132" r="15" fill="var(--figure-accent, #16763a)" stroke="var(--figure-bg, #e8f1e5)" stroke-width="2"/>
<circle cx="364" cy="132" r="14" fill="var(--figure-bg, #e8f1e5)" stroke="var(--figure-ink, #244333)" stroke-width="4"/>
<circle cx="548" cy="132" r="14" fill="var(--figure-bg, #e8f1e5)" stroke="var(--figure-ink, #244333)" stroke-width="4"/>
<path d="M 282 103 Q 318 75 351 100" fill="none" stroke="var(--figure-accent, #16763a)" stroke-width="4"/>
<path d="M 351 100 L 335 99 L 343 87 Z" fill="var(--figure-accent, #16763a)"/>
