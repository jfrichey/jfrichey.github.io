<circle cx="548" cy="304" r="14" fill="var(--figure-bg, #e8f1e5)" stroke="var(--figure-ink, #244333)" stroke-width="4"/>
<text x="364" y="367" fill="var(--figure-ink, #244333)" font-size="26" font-family="DejaVu Sans,Arial,sans-serif" font-weight="400" text-anchor="middle">2 active</text>
<circle cx="128" cy="432" r="13" fill="var(--figure-accent, #16763a)" stroke="var(--figure-bg, #e8f1e5)" stroke-width="2"/>
<text x="151" y="441" fill="var(--figure-ink, #244333)" font-size="25" font-family="DejaVu Sans,Arial,sans-serif" font-weight="400" text-anchor="start">active</text>
