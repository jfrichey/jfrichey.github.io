<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">A bridge auction</title>
  <desc id="desc">Four players sit around a bridge table with a one-spade, pass, two-heart, pass auction.</desc>
  <defs>
    <style>.bid{fill:#fffdf8;stroke:#d7d1c5;stroke-width:5}.seat{fill:#173f32;stroke:#f4f0e8;stroke-opacity:.5;stroke-width:5}.call{font:700 54px Georgia,serif;fill:#202321}.pass{font:700 35px Helvetica,Arial,sans-serif;fill:#4d514c;letter-spacing:3px}.dir{font:700 24px Helvetica,Arial,sans-serif;fill:#e9e2d6;letter-spacing:3px}</style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#f0ce68"/></marker>
  </defs>
  <rect width="1200" height="900" fill="#244c3c"/>
  <ellipse cx="600" cy="450" rx="465" ry="345" fill="#1e5b45" stroke="#fff" stroke-opacity=".15" stroke-width="5"/>
  <circle class="seat" cx="600" cy="91" r="58"/><circle class="seat" cx="1090" cy="450" r="58"/><circle class="seat" cx="600" cy="809" r="58"/><circle class="seat" cx="110" cy="450" r="58"/>
  <text class="dir" x="600" y="100" text-anchor="middle">N</text><text class="dir" x="1090" y="459" text-anchor="middle">E</text><text class="dir" x="600" y="818" text-anchor="middle">S</text><text class="dir" x="110" y="459" text-anchor="middle">W</text>
  <rect class="bid" x="470" y="160" width="260" height="152" rx="18"/><text class="call" x="600" y="254" text-anchor="middle">1♠</text>
  <rect class="bid" x="812" y="374" width="260" height="152" rx="18"/><text class="pass" x="942" y="466" text-anchor="middle">PASS</text>
  <rect class="bid" x="470" y="588" width="260" height="152" rx="18"/><text class="call" x="600" y="682" text-anchor="middle" fill="#b33d3a">2<tspan fill="#b33d3a">♥</tspan></text>
  <rect class="bid" x="128" y="374" width="260" height="152" rx="18"/><text class="pass" x="258" y="466" text-anchor="middle">PASS</text>
  <path d="M752 242c97 35 157 94 184 177M943 542c-34 89-92 145-178 178M435 720c-91-34-151-93-181-177M252 358c37-88 96-144 181-176" fill="none" stroke="#f0ce68" stroke-width="9" stroke-linecap="round" marker-end="url(#arrow)"/>
</svg>
