<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" role="img" aria-labelledby="ai-coupon-clocks-title ai-coupon-clocks-desc">
<title id="ai-coupon-clocks-title">Independent discovery clocks can ring together</title>
<desc id="ai-coupon-clocks-desc">Four chosen integer waiting times are 2, 5, 5 and 8. Clocks B and C ring together at time 5, illustrating a possible event for independent geometric clocks that cannot be two first discoveries in one coupon draw. This is a schematic, not a sampled data set.</desc>
