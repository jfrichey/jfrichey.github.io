<title id="ai-cluster-grid-title">Twenty-one clusters in a finite coloring</title>
<desc id="ai-cluster-grid-desc">A fixed fourteen-by-fourteen coloring has twenty-one black clusters under shared-edge adjacency. The largest cluster has twenty-seven squares, highlighted in the accent color. This finite example does not estimate the limiting density.</desc>
